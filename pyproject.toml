[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revhive-ai"
version = "0.3.18"
description = "10 AI agents review your code in 30 seconds. Security, performance, logic, and more. Supports MiMo, OpenAI, DeepSeek, Qwen, GLM, Kimi, Anthropic. Try `revhive demo` — no API key needed."
readme = "README.md"
license = {text = "BSL-1.1"}
requires-python = ">=3.10"
authors = [
    {name = "RevHive Team"}
]
keywords = ["code-review", "multi-agent", "langgraph", "ai", "security", "mimo", "xiaomi", "code-quality", "static-analysis", "linting", "code-scanning", "devsecops", "sast", "pull-request", "ci-cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

dependencies = [
    # Floors, not ceilings. The 0.3.x line carried 20 advisories at the time of
    # writing (langchain-core, langgraph, langgraph-checkpoint, langgraph-sdk),
    # and shipping a security-review tool with known-vulnerable dependencies is
    # a contradiction a customer's own scanner will find in seconds.
    #
    # The `langchain` meta-package is deliberately absent: it is a bundle we
    # never import, and it drags in langchain-text-splitters, which is one of
    # the advisories. We use core, openai and (optionally) anthropic only.
    "langgraph>=1.0.10",
    "langchain-core>=1.2.22",
    "langchain-openai>=1.1.14",
    "openai>=1.30.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.0.0",
]
tree-sitter = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]
all = [
    "revhive-ai[anthropic,tree-sitter,dev]",
]

[project.urls]
Homepage = "https://github.com/jovian-zhibai/RevHive"
Documentation = "https://github.com/jovian-zhibai/RevHive"
Repository = "https://github.com/jovian-zhibai/RevHive"
Issues = "https://github.com/jovian-zhibai/RevHive/issues"

[project.scripts]
revhive = "revhive.main:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["revhive*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
