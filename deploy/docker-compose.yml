services:
  revhive:
    build:
      context: ..
      dockerfile: Dockerfile
    # 与 pyproject.toml 的 version 保持一致；发版时一起改，别让它比实际版本超前。
    image: revhive:${REVHIVE_TAG:-0.3.27}
    container_name: revhive
    env_file:
      - .env
    volumes:
      # Mount the repository you want reviewed, read-only.
      # Change the left side to your own path.
      - ${REVIEW_PATH:-./repo}:/work:ro
      - ./reports:/reports
    working_dir: /work
    # No ports are published: RevHive is a CLI, it does not listen.
    # The only outbound traffic is to LLM_BASE_URL below.
    networks:
      - revhive-net
    command: ["--help"]

networks:
  revhive-net:
    driver: bridge
