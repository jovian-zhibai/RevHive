<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setting up RevHive…</title>
  <meta name="robots" content="noindex">
  <noscript><meta http-equiv="refresh" content="1;url=https://101-201-221-73.sslip.io/setup"></noscript>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #08080c; color: #e8e8ef;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .card { max-width: 30rem; padding: 2.5rem 2rem; text-align: center; }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 .5rem; letter-spacing: -.01em; }
    p { margin: 0 0 1.5rem; color: #9a9aa8; font-size: .875rem; }
    a { color: #8b7cf6; text-decoration: none; border-bottom: 1px solid rgba(139,124,246,.35); padding-bottom: 1px; }
    a:hover { border-bottom-color: #8b7cf6; }
    .dots { display: inline-flex; gap: 5px; margin-bottom: 1.25rem; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: #8b7cf6; opacity: .25; animation: pulse 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div class="card">
    <div class="dots"><i></i><i></i><i></i></div>
    <h1>Finishing your RevHive setup</h1>
    <p id="hint">Taking you to your dashboard…</p>
    <a id="go" href="/">Continue</a>
  </div>
  <script>
    (function () {
      var API = "https://101-201-221-73.sslip.io/setup";
      var target = API + window.location.search;
      var link = document.getElementById("go");
      link.href = target;
      link.textContent = "Continue to your dashboard";
      setTimeout(function () { window.location.replace(target); }, 300);
    })();
  </script>
</body>
</html>
